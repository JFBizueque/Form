<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Kontaktformular</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .form-container {
      background: white;
      padding: 30px;
      border-radius: 12px;
      width: 400px;
      box-shadow: 0 0 15px rgba(0,0,0,0.1);
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    input,
    textarea {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    textarea {
      resize: vertical;
      min-height: 120px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 15px;
      border: none;
      border-radius: 8px;
      background: #007bff;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #0056b3;
    }
  </style>
</head>
<body>

  <div class="form-container">
    <h2>Kontaktformular</h2>

    <form action="send.php" method="POST">

      <input 
        type="text" 
        name="name" 
        placeholder="Vorname & Nachname" 
        required
      >

      <input 
        type="email" 
        name="email" 
        placeholder="E-Mail Adresse" 
        required
      >

      <input 
        type="tel" 
        name="telefon" 
        placeholder="Telefonnummer"
      >

      <textarea 
        name="nachricht" 
        placeholder="Deine Nachricht..." 
        required
      ></textarea>

      <button type="submit">
        Abschicken
      </button>

    </form>
  </div>

</body>
</html>
